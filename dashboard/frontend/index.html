<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inkplate Dashboard</title>
    <!--
      The ground colour, before the stylesheet has loaded. One line rather than
      the theme bootstrap that used to live here: the editor is light only now,
      so there is no stored choice to read and nothing to resolve before paint.

      viewport-fit=cover on the meta above is what makes env(safe-area-inset-bottom)
      report a real number, which the mobile tab bar pads itself by.
    -->
    <style>
      html,
      body {
        background: #efece6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
