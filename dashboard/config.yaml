# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Inkplate Dashboard
version: "0.1.1"
slug: inkplate_dashboard
description: Edit the layout of an Inkplate 5 e-ink dashboard and push it over MQTT
url: "https://github.com/leonherrmann/ha-inkplate-dashboard"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
services:
  - mqtt:want
# Needed for the state bridge: reading entity states over the Supervisor proxy
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-edit
options:
  device_id: inkplate5v2
  log_level: info
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  device_id: str
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
