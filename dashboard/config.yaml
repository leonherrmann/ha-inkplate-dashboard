# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Inkplate Dashboard
version: "0.17.0"
slug: inkplate_dashboard
description: Edit the layout of an Inkplate 5 e-ink dashboard and push it over MQTT
url: "https://github.com/leonherrmann/ha-inkplate-dashboard"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
services:
  - mqtt:want
# Needed for the state bridge: reading entity states over the Supervisor proxy
homeassistant_api: true
# Needed to ask the Supervisor for the host's own address, which is what the
# device is told to fetch images from. Without it that call is refused and
# image_base_url has to be set by hand.
hassio_api: true
ingress: true
ingress_port: 8099
# The device fetches uploaded images over plain HTTP; it cannot use ingress
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Image downloads for the Inkplate (no authentication)
panel_icon: mdi:view-dashboard-edit
options:
  device_id: inkplate5v2
  log_level: info
  image_base_url: ""
  firmware_repo: ""
  github_token: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  device_id: str
  log_level: list(debug|info|warning|error)
  image_base_url: str?
  firmware_repo: str?
  github_token: password?
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
